<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - DevHub</title>
    <style>
        body { font-family: 'Consolas', 'Courier New', monospace, sans-serif; margin: 0; padding: 0; color: #e0e0e0; background-color: transparent; }
        #code-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; background-color: #0b111a; pointer-events: none; }
        .code-stream { position: absolute; top: -100px; font-size: 1.2rem; color: rgba(0, 210, 255, 0.4); white-space: nowrap; animation: fall-stream linear infinite; }
        @keyframes fall-stream { to { transform: translateY(110vh); } }

        header { background-color: rgba(30, 30, 30, 0.8); backdrop-filter: blur(5px); padding: 1.5rem 2rem; border-bottom: 2px solid #00d2ff; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; color: #00d2ff; font-size: 1.5rem; }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 1.1rem; }
        nav a:hover { color: #00d2ff; }

        .auth-container { max-width: 400px; margin: 50px auto; padding: 30px; background-color: rgba(30, 41, 59, 0.7); border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
        h2 { color: #fff; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; color: #a0a0a0; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; color: #fff; box-sizing: border-box; font-family: inherit; }
        .form-group input:focus { border-color: #00d2ff; outline: none; }
        
        .btn-submit { width: 100%; background-color: #00d2ff; color: #000; border: none; padding: 10px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { background-color: #0099cc; color: #fff; }
        .link-text { margin-top: 15px; font-size: 0.9rem; color: #a0a0a0; }
        .link-text a { color: #00d2ff; text-decoration: none; }
    </style>
</head>
<body>
    <div id="code-background"></div>
    <script>
        const bg = document.getElementById('code-background');
        const chars = ['0', '1', '{', '}', '#', 'REG', 'USER'];
        for (let i = 0; i < 30; i++) {
            const stream = document.createElement('div');
            stream.className = 'code-stream';
            stream.style.left = Math.random() * 100 + 'vw';
            stream.style.animationDuration = (5 + Math.random() * 10) + 's';
            for (let j = 0; j < 15; j++) {
                const span = document.createElement('span');
                span.innerText = chars[Math.floor(Math.random() * chars.length)];
                span.style.opacity = Math.random() * 0.5;
                stream.appendChild(span);
                stream.appendChild(document.createElement('br'));
            }
            bg.appendChild(stream);
        }
    </script>

    <header>
        <a href="index.html" style="text-decoration: none;"><h1>&#60;DevHub/&#62;</h1></a>
        <nav><a href="index.html">← กลับหน้าแรก</a></nav>
    </header>

    <div class="auth-container">
        <h2>สมัครสมาชิก DevHub</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="regUser" required placeholder="กรอกชื่อผู้ใช้...">
            </div>
            <div class="form-group">
                <label>รหัสผ่าน (Password)</label>
                <input type="password" id="regPass" required placeholder="กรอกรหัสผ่าน...">
            </div>
            <button type="submit" class="btn-submit">ลงทะเบียน</button>
        </form>
        <div class="link-text">
            มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบที่นี่</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;

            // บันทึกข้อมูลลง LocalStorage
            localStorage.setItem('devhub_reg_user', user);
            localStorage.setItem('devhub_reg_pass', pass);
            // ตั้งต้นยอดเงินเป็น 0 บาทถ้ายังไม่มี
            if(!localStorage.getItem('devhub_balance')) {
                localStorage.setItem('devhub_balance', '0');
            }

            alert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
